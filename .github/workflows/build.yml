name: Build desktop binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: coach-potato-linux
            binary: dist/coach-potato
          - os: windows-latest
            artifact: coach-potato-windows
            binary: dist/coach-potato.exe
          - os: macos-latest
            artifact: coach-potato-macos
            binary: dist/coach-potato-macos.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          pip install pywebview || true
      - name: Build
        shell: bash
        run: |
          ICON=""
          WINDOWED=""
          # --windowed suppresses the console/Terminal window that would
          # otherwise pop up alongside the pywebview app window; ignored on
          # Linux (PyInstaller has no console concept there). On macOS it
          # also switches the output from a flat binary to a proper .app
          # bundle, which is what makes double-click-to-launch not open
          # Terminal in the first place.
          [[ "${{ matrix.os }}" == windows-latest ]] && ICON="--icon assets/icon.ico" && WINDOWED="--windowed"
          [[ "${{ matrix.os }}" == macos-latest ]] && ICON="--icon assets/icon.icns" && WINDOWED="--windowed"
          # websocket-client is imported lazily inside server/obs.py, so name
          # it explicitly rather than trusting static analysis to reach it
          pyinstaller --onefile --noconfirm --name coach-potato \
            --hidden-import websocket \
            --add-data "static:static" --add-data "VERSION:." $ICON $WINDOWED desktop.py
      - name: Package macOS app bundle
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent dist/coach-potato.app dist/coach-potato-macos.zip
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" packaging\windows-installer.iss
      - name: Smoke-test the update helper
        # runs the real PowerShell helper from server/updater.py in portable
        # mode against throwaway exes, LAUNCHED THE WAY THE APP LAUNCHES IT
        # (updater._spawn_detached, then the launcher exits): waits for the
        # lock, swaps the file, keeps a .old copy, relaunches, logs success.
        # Running the script directly missed v1.81.2's DETACHED_PROCESS bug.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "upd"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$d\app.exe"
          Copy-Item "$env:SystemRoot\System32\hostname.exe" "$d\new.exe"
          python -c "import os, sys; sys.path.insert(0, '.'); from server import updater; d = sys.argv[1]; open(os.path.join(d, 'apply-update.ps1'), 'w').write(updater.HELPER_SCRIPT); updater._spawn_detached(['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', '-File', os.path.join(d, 'apply-update.ps1'), '-AppPid', '0', '-Mode', 'portable', '-Source', os.path.join(d, 'new.exe'), '-Target', os.path.join(d, 'app.exe'), '-Version', '9.9.9', '-Log', os.path.join(d, 'update.log')]); os._exit(0)" $d
          for ($i = 0; $i -lt 60; $i++) {
            if (Select-String -Path "$d\update.log" -Pattern "installed v9.9.9" -Quiet -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content "$d\update.log" -ErrorAction SilentlyContinue
          if (-not (Select-String -Path "$d\update.log" -Pattern "installed v9.9.9" -Quiet -ErrorAction SilentlyContinue)) { throw "helper did not install" }
          if ((Get-FileHash "$d\app.exe").Hash -ne (Get-FileHash "$d\new.exe").Hash) { throw "exe not replaced" }
          if (-not (Test-Path "$d\app.exe.old")) { throw "no backup kept" }
      - name: Smoke-test an installer-mode update
        # install the fresh CoachPotatoSetup.exe silently, then update that
        # install through the helper exactly as the app would (installer mode
        # = Inno /VERYSILENT over the existing install)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist\installer\CoachPotatoSetup.exe).Path
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "first install failed: $($p.ExitCode)" }
          $target = Join-Path $env:LOCALAPPDATA "Programs\CoachPotato\coach-potato.exe"
          if (-not (Test-Path (Join-Path (Split-Path $target) "unins000.exe"))) { throw "not an installer install" }
          $d = Join-Path $env:RUNNER_TEMP "upd-installer"
          New-Item -ItemType Directory -Force $d | Out-Null
          python -c "import os, sys; sys.path.insert(0, '.'); from server import updater; d, setup, target = sys.argv[1:4]; open(os.path.join(d, 'apply-update.ps1'), 'w').write(updater.HELPER_SCRIPT); updater._spawn_detached(['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', '-File', os.path.join(d, 'apply-update.ps1'), '-AppPid', '0', '-Mode', 'installer', '-Source', setup, '-Target', target, '-Version', '9.9.9', '-Log', os.path.join(d, 'update.log')]); os._exit(0)" $d $setup $target
          for ($i = 0; $i -lt 120; $i++) {
            if (Select-String -Path "$d\update.log" -Pattern "installed v9.9.9|update failed" -Quiet -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content "$d\update.log" -ErrorAction SilentlyContinue
          if (-not (Select-String -Path "$d\update.log" -Pattern "installed v9.9.9" -Quiet -ErrorAction SilentlyContinue)) { throw "installer-mode update failed" }
          Get-Process coach-potato -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: coach-potato-windows-installer
          path: dist/installer/CoachPotatoSetup.exe
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXT=""
          [[ "${{ matrix.binary }}" == *.exe ]] && EXT=".exe"
          [[ "${{ matrix.binary }}" == *.zip ]] && EXT=".zip"
          OUT="${{ matrix.artifact }}${EXT}"
          cp "${{ matrix.binary }}" "$OUT"
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "**New here?** You'll need a free Riot API key — [step-by-step guide](https://github.com/${{ github.repository }}/blob/main/docs/riot-api-key.md)." \
            2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$OUT" --clobber
      - name: Attach Windows installer to release
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/installer/CoachPotatoSetup.exe --clobber
      - name: Attach Windows checksums to release
        # the in-app updater (server/updater.py) refuses a release without
        # these; names must match the release asset names above
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp dist/coach-potato.exe coach-potato-windows.exe
          cp dist/installer/CoachPotatoSetup.exe CoachPotatoSetup.exe
          sha256sum coach-potato-windows.exe CoachPotatoSetup.exe > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS-windows.txt --clobber
